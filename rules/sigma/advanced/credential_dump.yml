title: Credential dumping tool execution
id: credential_dump_tool
status: test
description: Detects command lines associated with known credential-access tooling.
level: critical
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    EventID: "1"
    CommandLine|contains:
      - "sekurlsa::logonpasswords"
      - "lsadump::sam"
      - "procdump"
    Image|endswith:
      - '\mimikatz.exe'
      - '\procdump.exe'
  condition: selection
tags:
  - attack.credential_access
  - attack.t1003
version: "1.0.0"